name = "spore-max"
main = "src/worker.js"
compatibility_date = "2026-11-16"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "spore-max-db"
database_id = "ff92a320-84b3-44bb-9dde-9ec9c0028e2f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "spore-max-media"

[vars]
APP_NAME = "SPORE MAX"
APP_ORIGIN = "https://spore-max.spore-cybernetics.workers.dev"
