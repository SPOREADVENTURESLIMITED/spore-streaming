name = "spore-max"
main = "src/worker.js"
compatibility_date = "2026-11-16"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "spore-max-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "spore-max-media"

[vars]
APP_NAME = "SPORE MAX"
APP_ORIGIN = "https://REPLACE_WITH_YOUR_DOMAIN"
